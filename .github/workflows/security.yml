name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: "0 4 * * 1"

jobs:
  audit:
    name: Security Vulnerability & Lint Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install system tools (ripgrep)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Set up Python
        run: uv python install 3.13

      - name: Check dependency vulnerabilities with uv audit
        run: uv audit

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Test Suite
        run: uv run --extra web pytest tests/ --ignore=tests/test_code_writer_e2e.py
