name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 04:00 UTC
    - cron: "0 4 * * 1"

jobs:
  audit:
    name: Security Vulnerability & Lint Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check dependency vulnerabilities with uv audit
        run: uv audit

      - name: Run Ruff Linter
        run: uv run ruff check .
