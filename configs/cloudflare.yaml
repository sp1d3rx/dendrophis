# Cloudflare Workers AI Configuration for Dendrophis
# Usage: dendrophis --config cloudflare.yaml
#
# Get your credentials from:
#   - Account ID: Cloudflare Dashboard (right sidebar)
#   - API Token: https://dash.cloudflare.com/profile/api-tokens (use 'Cloudflare AI' template)

llm:
  # --- Connection Settings ---
  # Base URL of the OpenAI-compatible API endpoint (Cloudflare Workers AI OpenAI-compatible endpoint)
  base_url: "https://api.cloudflare.com/client/v4/accounts/YOUR_ACCOUNT_ID/ai/v1"
  # API key used for authentication (Set via DENDROPHIS_API_KEY env var or paste token here)
  api_key: ""
  # Maximum network request timeout in seconds
  timeout: 120.0

  # --- Model Selection ---
  # The primary LLM used for standard chat and agentic reasoning
  # Recommended models (prefix with @cf/ for Cloudflare-hosted models)
  # See full list: https://developers.cloudflare.com/workers-ai/models/
  model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
  # model: "@cf/meta/llama-3.1-8b-instruct"
  # model: "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b"
  # model: "@cf/mistral/mistral-7b-instruct-v0.1"
  # The model dedicated to the code-writer subagent for executing code changes (null = fallback to default)
  code_writer_model: null

  # --- Context & Compaction ---
  # Maximum context window limit in tokens (Workers AI context window varies by model)
  context_limit: 32768
  # Compress history when token usage exceeds this fraction of the context limit (e.g., 0.85 = 85%)
  compaction_threshold: 0.85

  # --- Generation & Sampling ---
  # Maximum tokens the model is allowed to generate per response
  max_tokens: 4096
  # Sampling temperature (lower is more deterministic, higher is more creative)
  temperature: 0.2

sidebar:
  position: right
  width: 28
  panels:
    - model
    - status
    - tokens
    - speed
    - context
    - temperature
    - cache
    - cost
    - sysinfo

hooks:
  pre_tool_use: []
  post_tool_use: []

tools:
  extra_paths: []
  max_calls: 3
  require_confirmation:
    - bash
    - edit

caching:
  enabled: true
  tier1_system_prompt: true
  tier1_tool_definitions: true
  tier2_file_blocks: true
  tier2_file_blocks_stable_turns: 3
  tier2_project_understanding: true
  tier2_project_understanding_min_turns: 5

memory_db: "~/.config/dendrophis/memory.db"
